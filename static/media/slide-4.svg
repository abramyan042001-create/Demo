<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675"> <!-- Задаём одинаковый размер всех четырёх векторных кадров, без пиксельного размытия. -->
<rect width="1200" height="675" fill="#234f55"/> <!-- Однотонная подложка соответствует общей палитре портала. -->
<circle cx="1020" cy="120" r="310" fill="#ffffff" opacity=".06"/> <!-- Большой полупрозрачный круг создаёт декоративный фон. -->
<circle cx="950" cy="570" r="210" fill="#b6dfc5" opacity=".1"/> <!-- Второй круг добавляет глубину композиции. -->
<text x="70" y="115" fill="#b9dcc8" font-family="sans-serif" font-size="24" letter-spacing="4">ОНЛАЙН-ОБУЧЕНИЕ</text> <!-- Маленькая верхняя подпись называет направление курса. -->
<text x="70" y="270" fill="#ffffff" font-family="sans-serif" font-size="64" font-weight="700">Ваш темп.</text> <!-- Крупная строка несёт главный смысл иллюстрации. -->
<text x="70" y="350" fill="#ffffff" font-family="sans-serif" font-size="47">Ваш новый навык.</text> <!-- Вторая строка дополняет образовательное предложение. -->
<text x="885" y="515" fill="#b9dcc8" font-family="monospace" font-size="100" font-weight="700">→</text> <!-- Кодовый или типографический символ обозначает тему без внешних изображений. -->
<text x="70" y="555" fill="#b9dcc8" font-family="sans-serif" font-size="27">Корочки.есть / Практика начинается здесь</text> <!-- Нижняя подпись объединяет все кадры единым брендом. -->
</svg> <!-- Закрываем векторный документ. -->
